
databaseChangeLog:
  - changeSet:
      id: 003
      author: sahin
      changes:
        - createTable:
            tableName: loan
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_loan_book
                    references: book(id)

              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_loan_member
                    references: member(id)

              - column:
                  name: borrow_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: return_date
                  type: DATE

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
